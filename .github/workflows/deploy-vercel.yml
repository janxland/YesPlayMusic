name: Deploy Web to Vercel

# 合并 PR（push 到 master）即构建 Web 版并上传到 Vercel 生产环境
# 站点：https://music.vercel.roginx.ink（项目 ypm-music-landing，未接 Vercel Git 集成，纯 CLI 上传）
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-vercel-master
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          # Vite 7 要求 Node 20.19+，与 package.json engines（24.x）和 deploy-cdn.yml 对齐
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web
        env:
          # publicPath /（资源同源，产物自包含）已由 .env.production 的 VITE_PUBLIC_PATH=/ 提供
          VITE_LASTFM_API_KEY: 09c55292403d961aa517ff7f5e8a3d9c
          VITE_LASTFM_API_SHARED_SECRET: 307c9fda32b3904e53654baff215cb67
          # API 与 Vercel 入口解耦（2026-10-25，用量治理）：直连源站 ncmapi
          # （CORS 回显 Origin 实测可用；绝对地址下 request.ts 自动 query 传 cookie，
          # 登录态不受影响）。/api 不再经 Vercel rewrite——每个 API 调用曾是
          # 一次计费 CDN Request（3M/30d 超限的构成大头），解耦后归零
          VITE_NETEASE_API_URL: https://ncmapi.roginx.ink/api
        run: |
          pnpm run build
          # vercel deploy 只认被上传目录里的配置，三件都必须进 dist：
          #   vercel.json  —— SPA 回退 + 显式 proxy.entrypoint（middleware 的
          #                    入口声明：dist 无构建步骤，不能赌 middleware.ts
          #                    文件约定的自动检测，2026-10-25 事故根因之一）
          #   middleware.ts—— 爬虫护栏本体（2026-10-10~10-25 从未进过产物，
          #                    护栏空转导致配额打爆，勿删此 cp）
          #   package.json —— 文件约定要求 middleware.ts 与它同级；type:module
          #                    同时满足 frameworkless 部署的 ESM 要求
          cp vercel.json dist/vercel.json
          cp middleware.ts dist/middleware.ts
          printf '{"private":true,"type":"module"}\n' > dist/package.json
      - name: Deploy to Vercel production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token '${{ secrets.VERCEL_API_TOKEN }}' dist
