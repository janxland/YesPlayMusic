name: Deploy Web to Vercel

# 合并 PR（push 到 master）即构建 Web 版并上传到 Vercel 生产环境
# 站点：https://music.vercel.roginx.ink（项目 ypm-music-landing，未接 Vercel Git 集成，纯 CLI 上传）
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-vercel-master
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          # 与 Release workflow 的 check 任务一致：Node 18 + legacy provider 跑 webpack4
          node-version: 18
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          # 覆盖 .env.production 的 COS publicPath：Vercel 站点资源走同源，产物自包含
          VUE_APP_PUBLIC_PATH: /
          VUE_APP_NETEASE_API_URL: /api
          VUE_APP_LASTFM_API_KEY: 09c55292403d961aa517ff7f5e8a3d9c
          VUE_APP_LASTFM_API_SHARED_SECRET: 307c9fda32b3904e53654baff215cb67
        run: |
          pnpm run build
          # vercel deploy 只认被上传目录里的 vercel.json（/api 反代 + SPA 回退）
          cp vercel.json dist/vercel.json
      - name: Deploy to Vercel production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token '${{ secrets.VERCEL_API_TOKEN }}' dist
