name: Release

on:
  push:
    branches:
      - master
    tags:
      - v*
  workflow_dispatch:

# 同一分支/标签只保留最新一次运行，旧的排队与在跑自动取消（防队列积压）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # push 到 master 只跑轻量校验（单 ubuntu，几分钟）；
  # 三平台打包矩阵只在打 tag 或手动 dispatch 时跑 —— 迭代 push 不再排队 15~45 分钟的打包。
  check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Web build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          VUE_APP_NETEASE_API_URL: /api
          VUE_APP_LASTFM_API_KEY: 09c55292403d961aa517ff7f5e8a3d9c
          VUE_APP_LASTFM_API_SHARED_SECRET: 307c9fda32b3904e53654baff215cb67
        run: pnpm run build

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.snapcraft_token }}

    strategy:
      fail-fast: false
      matrix:
        # macos-13（Intel 退役后仅存 arm64 供给且货源极少，排队 5h+）→ macos-latest（Apple Silicon，容量大）。
        # Electron 13 无 darwin-arm64 构建：用 ELECTRON_ARCH=x64 让 extract 脚本装 x64 二进制，
        # 打包用 --x64 只出 x64 dmg（arm64/universal 对 Electron 13 本就不可行）。
        os: [macos-latest, windows-latest, ubuntu-22.04]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        # 不指定 version：自动读取 package.json 的 packageManager 字段（pnpm@9.15.9），
        # 避免与 pnpm/action-setup 的 version 参数冲突（ERR_PNPM_BAD_PM_VERSION）

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          # Node 18 LTS：pnpm 9 要求 >=18.12，且 --openssl-legacy-provider 仍可用
          node-version: 18
          cache: 'pnpm'

      # 跨 run 缓存 electron zip 与 electron-builder 工具链（nsis/dmg 模板等），
      # 命中后 mac/win 打包可省数分钟；key 挂 lockfile 哈希，依赖变更自动失效。
      - name: Cache Electron toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.local/share/electron
            ${{ github.workspace }}/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install RPM & Pacman (on Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update &&
          sudo apt-get install --no-install-recommends -y rpm &&
          sudo apt-get install --no-install-recommends -y libarchive-tools &&
          sudo apt-get install --no-install-recommends -y libopenjp2-tools

      - name: Install Snapcraft (on Ubuntu)
        uses: samuelmeuli/action-snapcraft@v3
        if: startsWith(matrix.os, 'ubuntu')

      - name: Install dependencies
        run: |
          set -eo pipefail
          if ! pnpm install --frozen-lockfile > /tmp/pnpm-install.log 2>&1; then
            tail -n 40 /tmp/pnpm-install.log
            msg=$(tail -n 6 /tmp/pnpm-install.log | tr '\n' ' ' | tr '"' "'")
            echo "::error::pnpm install --frozen-lockfile failed: ${msg}"
            exit 1
          fi
          tail -n 5 /tmp/pnpm-install.log
        shell: bash

      # 渲染层构建链里有 require('electron')（取 path.txt 内容），CI 跳过 postinstall
      # 预装后 path.txt 不存在 → 插件吞掉异常、只报 "Vue CLI build failed"。
      # 打包前按平台补齐 electron 二进制（npmmirror 镜像，见 scripts/electron-auto-extract.js）。
      - name: Extract Electron binary
        shell: bash
        env:
          # arm64 mac runner 上强制 x64（Electron 13 无 darwin-arm64）
          ELECTRON_ARCH: ${{ runner.os == 'macOS' && 'x64' || '' }}
        run: |
          set -eo pipefail
          if ! pnpm run electron:extract > /tmp/electron-extract.log 2>&1; then
            tail -n 25 /tmp/electron-extract.log
            msg=$(tail -n 4 /tmp/electron-extract.log | tr '\n' ' ' | tr '"' "'")
            echo "::error::electron:extract failed: ${msg}"
            exit 1
          fi
          tail -n 3 /tmp/electron-extract.log

      # 不用 samuelmeuli/action-electron-builder：v1.6.0 无 skip_install 输入，
      # 会在 pnpm 装好的依赖上再跑一次自己的 npm/yarn install（macos exit 127、
      # ubuntu/windows exit 1 都出在这里），且失败日志只有 admin 能看。
      # 直接调 vue-cli-service electron:build，失败时把日志尾部转成 ::error:: 注解。
      - name: Build Electron app
        shell: bash
        env:
          # vue-cli/webpack4 构建需要 legacy provider（Node 18 支持该 flag）
          NODE_OPTIONS: --openssl-legacy-provider
          VUE_APP_NETEASE_API_URL: /api
          VUE_APP_ELECTRON_API_URL: /api
          VUE_APP_ELECTRON_API_URL_DEV: http://127.0.0.1:10754
          VUE_APP_LASTFM_API_KEY: 09c55292403d961aa517ff7f5e8a3d9c
          VUE_APP_LASTFM_API_SHARED_SECRET: 307c9fda32b3904e53654baff215cb67
          # electron-builder GitHub publisher 认 GH_TOKEN（仅打 tag 发版时用）
          GH_TOKEN: ${{ secrets.github_token }}
        run: |
          set -eo pipefail
          # 与旧 action 的 release 参数同语义：tag 触发才 --publish always
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then PUB=always; else PUB=never; fi
          ARCH_FLAG=""
          [[ "$RUNNER_OS" == "macOS" ]] && ARCH_FLAG="--x64"
          echo "publish=${PUB} arch_flag=${ARCH_FLAG}"
          if ! pnpm exec vue-cli-service electron:build --publish "${PUB}" ${ARCH_FLAG} 2>&1 | tee /tmp/electron-build.log; then
            tail -n 60 /tmp/electron-build.log
            # 真实报错（electron-builder 的 ⨯ 行）可能在日志任意位置，尾部 8 行只有 node 堆栈，
            # 所以把 error 特征行连同前一行上下文一起注解出来。
            err=$(grep -B1 -m 12 -E '⨯|ERROR|Error:|error Command|failed (with|task)' /tmp/electron-build.log \
              | head -n 30 | tr '\n' ' ' | tr '"' "'" | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error::electron build failed (publish=${PUB}): ${err}"
            exit 1
          fi
          ls -la dist_electron/
          # 匿名排障：产物清单转成 notice 注解（upload 匹配 0 文件时静默成功，需暴露真实产物名）
          files=$(ls dist_electron/ | tr '\n' ' ' | sed 's/%/%25/g')
          echo "::notice::dist_electron files: ${files:-EMPTY}"

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-mac
          path: |
            dist_electron/*.dmg
            !dist_electron/*.blockmap
          if-no-files-found: warn

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-win
          path: |
            dist_electron/*.exe
            !dist_electron/*.blockmap
          if-no-files-found: warn

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-linux
          path: |
            dist_electron/*.AppImage
            dist_electron/*.deb
          if-no-files-found: warn
