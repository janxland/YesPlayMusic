name: Release

on:
  push:
    branches:
      - master
    tags:
      - v*
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.snapcraft_token }}

    strategy:
      fail-fast: false
      matrix:
        # macos-13 = Intel x64 runner：Electron 13 无 darwin-arm64 构建，必须在 x64 环境安装/打包
        # （macos-latest 是 arm64，会因下载 darwin-arm64 zip 失败而报 "解压完成但未找到 electron 可执行文件"）
        os: [macos-13, windows-latest, ubuntu-22.04]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        # 不指定 version：自动读取 package.json 的 packageManager 字段（pnpm@9.15.9），
        # 避免与 pnpm/action-setup 的 version 参数冲突（ERR_PNPM_BAD_PM_VERSION）

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          # Node 18 LTS：pnpm 9 要求 >=18.12，且 --openssl-legacy-provider 仍可用
          node-version: 18
          cache: 'pnpm'

      - name: Install RPM & Pacman (on Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update &&
          sudo apt-get install --no-install-recommends -y rpm &&
          sudo apt-get install --no-install-recommends -y libarchive-tools &&
          sudo apt-get install --no-install-recommends -y libopenjp2-tools

      - name: Install Snapcraft (on Ubuntu)
        uses: samuelmeuli/action-snapcraft@v3
        if: startsWith(matrix.os, 'ubuntu')

      - name: Install dependencies
        run: |
          set -eo pipefail
          if ! pnpm install --frozen-lockfile > /tmp/pnpm-install.log 2>&1; then
            tail -n 40 /tmp/pnpm-install.log
            msg=$(tail -n 6 /tmp/pnpm-install.log | tr '\n' ' ' | tr '"' "'")
            echo "::error::pnpm install --frozen-lockfile failed: ${msg}"
            exit 1
          fi
          tail -n 5 /tmp/pnpm-install.log
        shell: bash

      # 渲染层构建链里有 require('electron')（取 path.txt 内容），CI 跳过 postinstall
      # 预装后 path.txt 不存在 → 插件吞掉异常、只报 "Vue CLI build failed"。
      # 打包前按平台补齐 electron 二进制（npmmirror 镜像，见 scripts/electron-auto-extract.js）。
      - name: Extract Electron binary
        shell: bash
        run: |
          set -eo pipefail
          if ! pnpm run electron:extract > /tmp/electron-extract.log 2>&1; then
            tail -n 25 /tmp/electron-extract.log
            msg=$(tail -n 4 /tmp/electron-extract.log | tr '\n' ' ' | tr '"' "'")
            echo "::error::electron:extract failed: ${msg}"
            exit 1
          fi
          tail -n 3 /tmp/electron-extract.log

      # 诊断用（定位后删）：vue-cli-plugin-electron-builder 的 catch(e) 吞掉真实异常，
      # CI 上 "Vue CLI build failed" 看不到原因。这里把泛化消息改成打印 e.stack。
      # 容错：pattern 找不到只 warning，不 hard fail（依赖升级后模板变了也不挡构建）。
      - name: 'Temp: unswallow plugin build error'
        shell: bash
        run: |
          node -e 'const fs=require("fs");const p="node_modules/vue-cli-plugin-electron-builder/index.js";let s=fs.readFileSync(p,"utf8");const lit=String.fromCharCode(39)+"Vue CLI build failed. Please resolve any issues with your build and try again."+String.fromCharCode(39);if(!s.includes(lit)){console.warn("patch target not found, skip");process.exit(0)}s=s.replace(lit,String.fromCharCode(39)+"Vue CLI build failed: "+String.fromCharCode(39)+"+(e&&e.stack||String(e))");fs.writeFileSync(p,s);console.log("patched ok")' || echo "::warning::unswallow patch skipped"

      # 不用 samuelmeuli/action-electron-builder：v1.6.0 无 skip_install 输入，
      # 会在 pnpm 装好的依赖上再跑一次自己的 npm/yarn install（macos exit 127、
      # ubuntu/windows exit 1 都出在这里），且失败日志只有 admin 能看。
      # 直接调 vue-cli-service electron:build，失败时把日志尾部转成 ::error:: 注解。
      - name: Build Electron app
        shell: bash
        env:
          # vue-cli/webpack4 构建需要 legacy provider（Node 18 支持该 flag）
          NODE_OPTIONS: --openssl-legacy-provider
          VUE_APP_NETEASE_API_URL: /api
          VUE_APP_ELECTRON_API_URL: /api
          VUE_APP_ELECTRON_API_URL_DEV: http://127.0.0.1:10754
          VUE_APP_LASTFM_API_KEY: 09c55292403d961aa517ff7f5e8a3d9c
          VUE_APP_LASTFM_API_SHARED_SECRET: 307c9fda32b3904e53654baff215cb67
          # electron-builder GitHub publisher 认 GH_TOKEN（仅打 tag 发版时用）
          GH_TOKEN: ${{ secrets.github_token }}
        run: |
          set -eo pipefail
          # 与旧 action 的 release 参数同语义：tag 触发才 --publish always
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then PUB=always; else PUB=never; fi
          echo "publish=${PUB}"
          if ! pnpm exec vue-cli-service electron:build --publish "${PUB}" 2>&1 | tee /tmp/electron-build.log; then
            tail -n 60 /tmp/electron-build.log
            # 真实报错（electron-builder 的 ⨯ 行）可能在日志任意位置，尾部 8 行只有 node 堆栈，
            # 所以把 error 特征行连同前一行上下文一起注解出来。
            err=$(grep -B1 -m 12 -E '⨯|ERROR|Error:|error Command|failed (with|task)' /tmp/electron-build.log \
              | head -n 30 | tr '\n' ' ' | tr '"' "'" | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error::electron build failed (publish=${PUB}): ${err}"
            exit 1
          fi
          ls -la dist_electron/

      - uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-mac
          path: dist_electron/*-universal.dmg
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-win
          path: dist_electron/*Setup*.exe
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-linux
          path: dist_electron/*.AppImage
          if-no-files-found: ignore
