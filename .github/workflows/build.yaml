name: Release

on:
  push:
    branches:
      - master
    tags:
      - v*
  workflow_dispatch:

# 同一分支/标签只保留最新一次运行，旧的排队与在跑自动取消（防队列积压）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # push 到 master 只跑轻量校验（单 ubuntu，几分钟）；
  # 三平台打包矩阵只在打 tag 或手动 dispatch 时跑 —— 迭代 push 不再排队 15~45 分钟的打包。
  check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          # Vite 7 要求 Node 20.19+，与 package.json engines（24.x）对齐
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Web build
        env:
          VITE_LASTFM_API_KEY: 09c55292403d961aa517ff7f5e8a3d9c
          VITE_LASTFM_API_SHARED_SECRET: 307c9fda32b3904e53654baff215cb67
        run: pnpm run build

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # 默认 token 权限只读，--publish always 建 Release 需要 contents:write
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        # macos-13（Intel 退役后仅存 arm64 供给且货源极少，排队 5h+）→ macos-latest（Apple Silicon，容量大）。
        # Electron 13 无 darwin-arm64 构建：用 ELECTRON_ARCH=x64 让 extract 脚本装 x64 二进制，
        # 打包用 --x64 只出 x64 dmg（arm64/universal 对 Electron 13 本就不可行）。
        os: [macos-latest, windows-latest, ubuntu-22.04]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        # 不指定 version：自动读取 package.json 的 packageManager 字段（pnpm@9.15.9），
        # 避免与 pnpm/action-setup 的 version 参数冲突（ERR_PNPM_BAD_PM_VERSION）

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          # Vite 7 要求 Node 20.19+，与 package.json engines（24.x）对齐
          node-version: 24
          cache: 'pnpm'

      # 跨 run 缓存 electron zip 与 electron-builder 工具链（nsis/dmg 模板等），
      # 命中后 mac/win 打包可省数分钟；key 挂 lockfile 哈希，依赖变更自动失效。
      - name: Cache Electron toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.local/share/electron
            ${{ github.workspace }}/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install RPM & Pacman (on Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update &&
          sudo apt-get install --no-install-recommends -y rpm &&
          sudo apt-get install --no-install-recommends -y libarchive-tools &&
          sudo apt-get install --no-install-recommends -y libopenjp2-tools

      - name: Install dependencies
        run: |
          set -eo pipefail
          if ! pnpm install --frozen-lockfile > /tmp/pnpm-install.log 2>&1; then
            tail -n 40 /tmp/pnpm-install.log
            msg=$(tail -n 6 /tmp/pnpm-install.log | tr '\n' ' ' | tr '"' "'")
            echo "::error::pnpm install --frozen-lockfile failed: ${msg}"
            exit 1
          fi
          tail -n 5 /tmp/pnpm-install.log
        shell: bash

      # 不用 samuelmeuli/action-electron-builder：v1.6.0 无 skip_install 输入，
      # 会在 pnpm 装好的依赖上再跑一次自己的 npm/yarn install（macos exit 127、
      # ubuntu/windows exit 1 都出在这里），且失败日志只有 admin 能看。
      # 直接调 electron:build（vite 渲染层 + esbuild 主进程 + electron-builder），
      # 失败时把日志尾部转成 ::error:: 注解。
      - name: Build Electron app
        shell: bash
        env:
          VITE_LASTFM_API_KEY: 09c55292403d961aa517ff7f5e8a3d9c
          VITE_LASTFM_API_SHARED_SECRET: 307c9fda32b3904e53654baff215cb67
          # electron-builder GitHub publisher 认 GH_TOKEN（仅打 tag 发版时用）
          GH_TOKEN: ${{ secrets.github_token }}
        run: |
          set -eo pipefail
          # 与旧 action 的 release 参数同语义：tag 触发才 --publish always
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then PUB=always; else PUB=never; fi
          echo "publish=${PUB}"
          if ! pnpm run electron:build -- --publish "${PUB}" 2>&1 | tee /tmp/electron-build.log; then
            tail -n 60 /tmp/electron-build.log
            # 真实报错（electron-builder 的 ⨯ 行）可能在日志任意位置，尾部 8 行只有 node 堆栈，
            # 所以把 error 特征行连同前一行上下文一起注解出来。
            err=$(grep -B1 -m 12 -E '⨯|ERROR|Error:|error Command|failed (with|task)' /tmp/electron-build.log \
              | head -n 30 | tr '\n' ' ' | tr '"' "'" | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error::electron build failed (publish=${PUB}): ${err}"
            exit 1
          fi
          ls -la release/
          # 匿名排障：产物清单转成 notice 注解（upload 匹配 0 文件时静默成功，需暴露真实产物名）
          files=$(ls release/ | tr '\n' ' ' | sed 's/%/%25/g')
          echo "::notice::release files: ${files:-EMPTY}"

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-mac
          path: |
            release/*.dmg
            !release/*.blockmap
          if-no-files-found: warn

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-win
          path: |
            release/*.exe
            !release/*.blockmap
          if-no-files-found: warn

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/*.snap
            release/*.pacman
          if-no-files-found: warn
